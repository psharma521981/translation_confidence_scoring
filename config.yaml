seed: 42
data_dir: data
max_len: 128
test_size: 0.10   # fixed test split, grouped by source sentence
val_size: 0.15    # validation share of trainval, grouped by source sentence
fail_percentiles: [10, 15, 20]   # fail = below this percentile of the TRAIN target
fail_main_percentile: 15
target: z_mean   # regression target (annotator-bias-corrected)
display_score: mean   # raw 0-100 average, used only for display
